# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Session persistence: save/restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save sessions every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Restore pane contents as well
set -g @resurrect-capture-pane-contents 'on'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# Clipboard on yank: pick the right tool for the platform.
# Default: X11 (Linux)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# macOS
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"

# Wayland (Linux)
if-shell "[ -n \"$WAYLAND_DISPLAY\" ] && command -v wl-copy >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"

# WSL — https://github.com/equalsraf/win32yank
if-shell "uname -r | grep -qi microsoft" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'win32yank.exe -i'"

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set-option -g history-limit 100000

# Enable focus-events for Neovim autoread
set-option -g focus-events on

# TPM must be at the very bottom (initialize all plugins)
# Key bindings: prefix + I  (install), prefix + U  (update), prefix + alt+u  (uninstall)
run '~/.tmux/plugins/tpm/tpm'
