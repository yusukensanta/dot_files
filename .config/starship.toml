# custom.aws_session/gcloud_session (and the separator between them) are
# stale-while-revalidate: they serve a cached value immediately and refresh
# it in the background, so in normal use they return in low single-digit
# ms and essentially never approach this. The one case that can still take
# real time is the very first render ever for a given AWS profile (no
# cache yet) — bounded now (SSO cache files grep-prefiltered before jq ever
# touches them, sqlite3 given a 200ms busy_timeout) but not instant. 1000ms
# covers that
# plus headroom for the rest of the prompt (git status on a large repo,
# language version detectors, etc.) without letting a genuinely stuck
# command hang the prompt indefinitely (that's what ignore_timeout would
# do — avoid it). On timeout starship drops the module silently rather
# than erroring, so a valid session would look identical to no session —
# see aws_session.sh/gcloud_session.sh for why that should no longer
# actually happen in practice.
command_timeout = 1000

format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
$hostname\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
$cmd_duration\
[ ](fg:#1d2230)\
$fill\
${custom.aws_session}${custom.aws_gcloud_separator}${custom.gcloud_session}\
\n$character"""

[fill]
symbol = " "

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[hostname]
ssh_only = false
format = "[ $hostname ](bg:#a3aed2 fg:#090c0c)"
disabled = false

[cmd_duration]
min_time = 0
style = "bg:#1d2230"
format = '[[  $duration ](fg:#a0a9cb bg:#1d2230)]($style)'

[custom.aws_session]
# exec, not `bash "$path"`: the scripts are already executable, so this
# replaces the wrapping shell instead of forking a second process under it.
command = 'exec "$HOME/.config/starship/aws_session.sh"'
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "bg:#e0af68 fg:#1d2230"
format = '[[$output](fg:#1d2230 bg:#e0af68)]($style)'

[custom.aws_gcloud_separator]
command = 'exec "$HOME/.config/starship/aws_gcloud_separator.sh"'
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "fg:#ffffff"
format = '[$output]($style)'

[custom.gcloud_session]
command = 'exec "$HOME/.config/starship/gcloud_session.sh"'
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "bg:#9ece6a fg:#1d2230"
format = '[[$output](fg:#1d2230 bg:#9ece6a)]($style)'
